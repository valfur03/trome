name: Release to TestFlight

# Signs the app and its widget, and uploads them to App Store Connect for TestFlight, from the head of main.
# Not tried yet: no run has used it, so its first run is a trial (the release guide, "A build from GitHub").
# Started by hand only, on main: Actions > Release to TestFlight > Run workflow.
#
# The order, so that no secret opens before a person says yes:
# 1. The release checks, with no secret (release-checks.yml): make check, make server-check, the unsigned release
#    archive check, the render check, the phone set, and the E2E proof: the record that make full-run leaves on the Mac
#    after a full E2E pass (e2e-proof.yml). A commit with no record stops the run red here.
# 2. The job "Sign and upload" waits at the environment app-store, whose required reviewer is the maintainer and whose
#    branch rule is main only: GitHub gives it no secret before his approval. Its if: on main refuses a run started
#    from another branch or a tag, before the environment.
# 3. The job "Tag" writes builds/<version>/<build> on the commit, with the run's own token and no secret.
#
# The repo is public, so the logs of a run are public: no step prints a secret, Info.plist or the build settings; the
# archive and the .ipa are never an artifact; the host and the app token of the server are masked; the keychain is a
# new one with a random password, deleted at the end; every action is pinned to a full commit hash.
# ios/scripts/release-workflow-check.py (part of make check) proves these rules on this file.

on:
  workflow_dispatch:

permissions: {}

# One release or deploy at a time. A run never cancels a running one: a newer run waits for it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Release checks
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      statuses: read
      actions: read
    uses: ./.github/workflows/release-checks.yml

  build:
    name: Sign and upload
    needs: checks
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 60
    environment: app-store
    permissions:
      contents: read
    outputs:
      version: ${{ steps.number.outputs.version }}
      build: ${{ steps.number.outputs.build }}
    env:
      # The build of Xcode of the Mac that the project is made on, as in release-checks.yml.
      XCODE_BUILD: 27A266a
      XCODEGEN_VERSION: 2.46.0
      XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
      APP_ID: io.github.valfur03.trome
      WIDGET_ID: io.github.valfur03.trome.widget
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history with its tags: the build number reads every builds/ tag.
          fetch-depth: 0

      - name: Select the Xcode of ios/project.yml by its path, never the default of the image
        run: |
          version=$(sed -n -E 's/^  xcodeVersion: "?([0-9.]+)"?$/\1/p' ios/project.yml)
          xcode="/Applications/Xcode_${version}.app"
          if [ -z "$version" ] || [ ! -d "$xcode" ]; then
            echo "::error::The image has no ${xcode}: ios/project.yml asks Xcode ${version}"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          build=$(DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version | sed -n 's/^Build version //p')
          if [ "$build" != "$XCODE_BUILD" ]; then
            echo "::error::$xcode is build $build, not build $XCODE_BUILD: the build would not use the Xcode of the project"
            exit 1
          fi

      - name: Install XcodeGen, pinned by version and checksum
        run: |
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -fsSL -o "$tools/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          printf '%s  %s\n' "$XCODEGEN_SHA256" "$tools/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$tools/xcodegen.zip" -d "$tools"
          echo "$tools/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Write the App Store Connect API key to a file that only this job reads
        env:
          APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/release"
          printf '%s\n' "$APP_STORE_CONNECT_KEY" > "$RUNNER_TEMP/release/AuthKey.p8"

      - name: Take the build number from Apple and the build tags
        id: number
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ios/scripts/release-build-number.py next --key-file "$RUNNER_TEMP/release/AuthKey.p8"

      - name: Write the server of the store build
        env:
          TRAIN_SERVER_HOST: ${{ secrets.TRAIN_SERVER_HOST }}
          TRAIN_SERVER_APP_TOKEN: ${{ secrets.TRAIN_SERVER_APP_TOKEN }}
        run: |
          echo "::add-mask::$TRAIN_SERVER_HOST"
          echo "::add-mask::$TRAIN_SERVER_APP_TOKEN"
          umask 077
          printf 'TRAIN_SERVER_HOST = %s\nTRAIN_SERVER_APP_TOKEN = %s\n' "$TRAIN_SERVER_HOST" "$TRAIN_SERVER_APP_TOKEN" > ios/Config/Server.xcconfig

      # One request for the trains of one stop, as the app makes it: a wrong host or token would ship a build with no times.
      - name: Check that the production server accepts the host and the app token
        run: make release-server-check

      - name: Put the distribution certificate in a new keychain with a random password
        env:
          DISTRIBUTION_CERTIFICATE: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/release/release.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$DISTRIBUTION_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/release/certificate.p12" -P "$DISTRIBUTION_CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/security -k "$keychain" > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/release/certificate.p12"

      - name: Install the two App Store profiles, and write the signing settings and the export options
        env:
          APP_PROFILE: ${{ secrets.APP_PROFILE }}
          WIDGET_PROFILE: ${{ secrets.WIDGET_PROFILE }}
          TROME_RELEASE_TEAM: ${{ secrets.TROME_RELEASE_TEAM }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/release"
          installed="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$installed"
          printf '%s' "$APP_PROFILE" | base64 --decode > "$dir/app.mobileprovision"
          printf '%s' "$WIDGET_PROFILE" | base64 --decode > "$dir/widget.mobileprovision"
          for kind in app widget; do
            security cms -D -i "$dir/$kind.mobileprovision" > "$dir/$kind-profile.plist"
            if [ "$kind" = app ]; then wanted="$APP_ID"; else wanted="$WIDGET_ID"; fi
            if [ "$(plutil -extract Entitlements.application-identifier raw -o - "$dir/$kind-profile.plist")" != "$TROME_RELEASE_TEAM.$wanted" ]; then
              echo "::error::The secret of the $kind profile is not a profile of $wanted for the team of TROME_RELEASE_TEAM"
              exit 1
            fi
            expires=$(plutil -extract ExpirationDate raw -o - "$dir/$kind-profile.plist")
            if [ "$(date -j -u -f '%Y-%m-%dT%H:%M:%SZ' "$expires" +%s)" -lt "$(date -v+30d +%s)" ]; then
              echo "::warning::The $kind profile ends on ${expires%%T*}: make a new one before then (the release guide, A build from GitHub)"
            fi
            uuid=$(plutil -extract UUID raw -o - "$dir/$kind-profile.plist")
            cp "$dir/$kind.mobileprovision" "$installed/$uuid.mobileprovision"
            printf '%s\n' "$uuid" > "$dir/$kind-profile.uuid"
          done
          app_profile=$(cat "$dir/app-profile.uuid")
          widget_profile=$(cat "$dir/widget-profile.uuid")
          # Read by Base.xcconfig, as the maintainer's own file on his Mac: the team, and the profile of each target.
          {
            printf 'TROME_RELEASE_TEAM = %s\n' "$TROME_RELEASE_TEAM"
            printf 'TROME_RELEASE_PROFILE_io_github_valfur03_trome = %s\n' "$app_profile"
            printf 'TROME_RELEASE_PROFILE_io_github_valfur03_trome_widget = %s\n' "$widget_profile"
          } > ios/Config/Signing.xcconfig
          cat > "$dir/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$TROME_RELEASE_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_ID</key><string>$app_profile</string>
              <key>$WIDGET_ID</key><string>$widget_profile</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF

      - name: Archive the signed Release build of the app and its widget
        env:
          BUILD: ${{ steps.number.outputs.build }}
        run: |
          dir="$RUNNER_TEMP/release"
          # Settings over those of every target: signed by hand with the certificate, each target with its own profile
          # (named in Signing.xcconfig by its bundle ID), and the build number of the run. The version stays the repo's.
          printf '%s\n' 'CODE_SIGN_STYLE = Manual' 'CODE_SIGN_IDENTITY = Apple Distribution' \
            'PROVISIONING_PROFILE_SPECIFIER = $(TROME_RELEASE_PROFILE_$(PRODUCT_BUNDLE_IDENTIFIER:identifier))' \
            > "$dir/signing-override.xcconfig"
          make project
          cd ios
          scripts/quiet.sh "$dir/archive.log" '' xcodebuild -quiet -project TROME.xcodeproj -scheme TROME \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData -clonedSourcePackagesDirPath .build/SourcePackages \
            -xcconfig "$dir/signing-override.xcconfig" CURRENT_PROJECT_VERSION="$BUILD" \
            OTHER_CODE_SIGN_FLAGS="--keychain $dir/release.keychain-db" COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            -archivePath "$dir/TROME.xcarchive" -resultBundlePath "$dir/archive.xcresult" archive
          xcrun xcresulttool get build-results --path "$dir/archive.xcresult" | scripts/build-warnings.py

      # The archive check of make merge and of the release checks, now on the signed archive: the silent start, its push
      # capability and its app group, and no Wake log; then the version of the repo and the number of the run.
      - name: Check the signed archive
        env:
          VERSION: ${{ steps.number.outputs.version }}
          BUILD: ${{ steps.number.outputs.build }}
        run: |
          cd ios
          scripts/release-entitlements-check.py TROME.xcodeproj "$RUNNER_TEMP/release/TROME.xcarchive"
          scripts/release-archive-number.py "$RUNNER_TEMP/release/TROME.xcarchive" "$VERSION" "$BUILD"

      - name: Sign for the App Store and upload to App Store Connect
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          dir="$RUNNER_TEMP/release"
          ios/scripts/quiet.sh "$dir/upload.log" '' xcodebuild -exportArchive -archivePath "$dir/TROME.xcarchive" \
            -exportOptionsPlist "$dir/ExportOptions.plist" -exportPath "$dir/export" \
            -authenticationKeyPath "$dir/AuthKey.p8" -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Say what was uploaded, and from which proof
        env:
          VERSION: ${{ steps.number.outputs.version }}
          BUILD: ${{ steps.number.outputs.build }}
        run: |
          {
            echo "## TROME $VERSION ($BUILD), uploaded to App Store Connect from ${GITHUB_SHA:0:7}"
            echo ""
            echo "- E2E: proven at merge, for commit $GITHUB_SHA (the job E2E proof above names the record of the Mac)"
            echo "- Build number: one more than the highest that Apple holds and the highest builds/ tag"
            echo "- Version: MARKETING_VERSION of ios/Config/Base.xcconfig, not changed by the run"
            echo "- Next: Apple's email when the build is processed; then the row, the promise set and the phone set of the release guide"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the keychain, the key, the profiles and the archive
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release/release.keychain-db" 2> /dev/null || true
          rm -rf "$RUNNER_TEMP/release" ios/Config/Server.xcconfig ios/Config/Signing.xcconfig \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"

  tag:
    name: Tag the build
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Writes the tag builds/<version>/<build>; this job holds no secret.
      contents: write
    steps:
      - name: Tag the commit with the version and the build number
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          case "$VERSION/$BUILD" in
            *[!0-9./]* | /* | */) echo "::error::No version or build number from the job Sign and upload"; exit 1 ;;
          esac
          tag="builds/$VERSION/$BUILD"
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" -f tag="$tag" -f message="TROME $VERSION ($BUILD)" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$object" > /dev/null
          echo "- Tag $tag on ${GITHUB_SHA:0:7}" >> "$GITHUB_STEP_SUMMARY"
