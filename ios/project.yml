name: TROME

options:
  xcodeVersion: "27.0"
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    TROME_REFUSED_ID_io_github_valfur03_trome: SHIPPING_ID_REFUSED-run-make-generate
    TROME_REFUSED_ID_io_github_valfur03_trome_widget: SHIPPING_ID_REFUSED-run-make-generate
    TROME_OLD_SETTING_VALUES: none$(RATP_BUNDLE_ID_PREFIX)$(RATP_DEBUG_APP_BUNDLE_ID)$(RATP_DEBUG_WIDGET_BUNDLE_ID)
    TROME_OLD_SETTING_CHECK_none: passed
    TROME_OLD_SETTING_CHECK: $(TROME_OLD_SETTING_CHECK_$(TROME_OLD_SETTING_VALUES:identifier):default=refused)
    TROME_CHECKED_ID_PREFIX_IF_passed: $(TROME_BUNDLE_ID_PREFIX)
    TROME_CHECKED_ID_PREFIX_IF_refused: OLD_SETTING_NAME_REFUSED-run-make-generate
    TROME_CHECKED_ID_PREFIX: $(TROME_CHECKED_ID_PREFIX_IF_$(TROME_OLD_SETTING_CHECK))
    TROME_CHECKED_DEBUG_APP_ID_IF_passed: $(TROME_DEBUG_APP_BUNDLE_ID)
    TROME_CHECKED_DEBUG_WIDGET_ID_IF_passed: $(TROME_DEBUG_WIDGET_BUNDLE_ID)
    TROME_RELEASE_SIGN_STYLE_none: Manual
  configs:
    Debug:
      TROME_WANTED_APP_ID: $(TROME_CHECKED_DEBUG_APP_ID_IF_$(TROME_OLD_SETTING_CHECK):default=$(TROME_CHECKED_ID_PREFIX).trome.dev)
      APP_BUNDLE_ID: $(TROME_REFUSED_ID_$(TROME_WANTED_APP_ID:lower:identifier):default=$(TROME_WANTED_APP_ID))
      TROME_WANTED_WIDGET_ID: $(TROME_CHECKED_DEBUG_WIDGET_ID_IF_$(TROME_OLD_SETTING_CHECK):default=$(APP_BUNDLE_ID).widget)
      WIDGET_BUNDLE_ID: $(TROME_REFUSED_ID_$(TROME_WANTED_WIDGET_ID:lower:identifier):default=$(TROME_WANTED_WIDGET_ID))
      RATP_APP_PRIM_API_KEY: $(PRIM_API_KEY)
      # A Debug build asks PRIM for its trains; only the silent start, when it is on, asks the server.
      TROME_SILENT_START_SERVER_HOST_YES: $(TRAIN_SERVER_HOST)
      TROME_SILENT_START_APP_TOKEN_YES: $(TRAIN_SERVER_APP_TOKEN)
      RATP_APP_TRAIN_SERVER_HOST: $(TROME_SILENT_START_SERVER_HOST_$(TROME_SILENT_START:default=NO))
      RATP_APP_TRAIN_SERVER_APP_TOKEN: $(TROME_SILENT_START_APP_TOKEN_$(TROME_SILENT_START:default=NO))
    Release:
      APP_BUNDLE_ID: io.github.valfur03.trome
      WIDGET_BUNDLE_ID: io.github.valfur03.trome.widget
      DEVELOPMENT_TEAM: $(TROME_RELEASE_TEAM)
      CODE_SIGN_STYLE: $(TROME_RELEASE_SIGN_STYLE_$(TROME_RELEASE_TEAM:default=none):default=Automatic)
      RATP_APP_PRIM_API_KEY: ""
      RATP_APP_TRAIN_SERVER_HOST: $(TRAIN_SERVER_HOST)
      RATP_APP_TRAIN_SERVER_APP_TOKEN: $(TRAIN_SERVER_APP_TOKEN)
      RATP_REQUIRE_TRAIN_SERVER: YES

packages:
  TROMECore:
    path: Packages/TROMECore

targets:
  TROME:
    type: application
    platform: iOS
    sources:
      - App
      - Widget/LineBadge.swift
      - Widget/TransitLine+LocalizedName.swift
    dependencies:
      - package: TROMECore
      - package: TROMECore
        product: TROMEBadge
      - target: TROMEWidget
    preBuildScripts:
      - name: Refuse the old setting names
        script: '"$SRCROOT/scripts/old-setting-names.sh" xcode'
        inputFiles:
          - $(SRCROOT)/scripts/old-setting-names.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
      - name: Check the train server settings
        script: '"${SRCROOT}/scripts/train-server-check.sh"'
        inputFiles:
          - $(SRCROOT)/scripts/train-server-check.sh
        basedOnDependencyAnalysis: false
        showEnvVars: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: $(APP_NAME) uses your location to find the nearest metro or RER station.
        NSLocationAlwaysAndWhenInUseUsageDescription: $(APP_NAME) uses your location to tell you when you reach a metro or RER station, also when the app is closed.
        UIBackgroundModes:
          - location
        PRIMAPIKey: $(RATP_APP_PRIM_API_KEY)
        TrainServerHost: $(RATP_APP_TRAIN_SERVER_HOST)
        TrainServerAppToken: $(RATP_APP_TRAIN_SERVER_APP_TOKEN)
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # The silent start (TROME_SILENT_START = YES in Config/Local.xcconfig, for a paid team only) compiles the push
      # code and adds the push capability. Release keeps it out until the silent start is turned on for the store.
      configs:
        Debug:
          TROME_SILENT_START_CONDITION_YES: SILENT_START
          TROME_SILENT_START_ENTITLEMENTS_YES: Config/SilentStart.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(TROME_SILENT_START_CONDITION_$(TROME_SILENT_START:default=NO))
          CODE_SIGN_ENTITLEMENTS: $(TROME_SILENT_START_ENTITLEMENTS_$(TROME_SILENT_START:default=NO))

  TROMEWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    dependencies:
      - package: TROMECore
      - package: TROMECore
        product: TROMEBadge
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)Widget
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  TROMEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: TROME
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TROME_CHECKED_ID_PREFIX).trome.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TROME

  TROMEDocsScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DocsScreenshots
      - UITests/SimulatorNotificationService.swift
    dependencies:
      - target: TROME
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TROME_CHECKED_ID_PREFIX).trome.dev.docs-screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TROME

  TROMERenderCheckHost:
    type: application
    platform: iOS
    sources:
      - RenderCheck/Host
      - Widget/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TROME_CHECKED_ID_PREFIX).trome.dev.render-check-host
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  TROMERenderCheck:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RenderCheck
        excludes:
          - Host
      - path: Widget
        excludes:
          - TROMEWidgetBundle.swift
          - Localizable.xcstrings
    dependencies:
      - package: TROMECore
      - package: TROMECore
        product: TROMEBadge
      - target: TROMERenderCheckHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TROME_CHECKED_ID_PREFIX).trome.dev.render-check
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TROME:
    build:
      targets:
        TROME: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: TROMECore/TROMECoreTests
        - package: TROMECore/TROMEBadgeTests

  TROMEUITests:
    build:
      targets:
        TROME: all
    test:
      config: Debug
      targets:
        - TROMEUITests

  TROMEDocsScreenshots:
    build:
      targets:
        TROME: all
    test:
      config: Debug
      targets:
        - TROMEDocsScreenshots

  TROMERenderCheck:
    build:
      targets:
        TROMERenderCheck: all
    test:
      config: Debug
      targets:
        - TROMERenderCheck
