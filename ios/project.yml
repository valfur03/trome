name: RATPActivity

options:
  xcodeVersion: "27.0"
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    RATP_REFUSED_ID_io_github_valfur03_trome: SHIPPING_ID_REFUSED-run-make-generate
    RATP_REFUSED_ID_io_github_valfur03_trome_widget: SHIPPING_ID_REFUSED-run-make-generate
  configs:
    Debug:
      RATP_WANTED_APP_ID: $(RATP_DEBUG_APP_BUNDLE_ID:default=$(RATP_BUNDLE_ID_PREFIX).trome.dev)
      APP_BUNDLE_ID: $(RATP_REFUSED_ID_$(RATP_WANTED_APP_ID:lower:identifier):default=$(RATP_WANTED_APP_ID))
      RATP_WANTED_WIDGET_ID: $(RATP_DEBUG_WIDGET_BUNDLE_ID:default=$(APP_BUNDLE_ID).widget)
      WIDGET_BUNDLE_ID: $(RATP_REFUSED_ID_$(RATP_WANTED_WIDGET_ID:lower:identifier):default=$(RATP_WANTED_WIDGET_ID))
    Release:
      APP_BUNDLE_ID: io.github.valfur03.trome
      WIDGET_BUNDLE_ID: io.github.valfur03.trome.widget
      CODE_SIGN_STYLE: Manual

packages:
  RATPCore:
    path: Packages/RATPCore

targets:
  RATPActivity:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: RATPCore
      - target: RATPActivityWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: $(APP_NAME) uses your location to find the nearest metro or RER station.
        NSLocationAlwaysAndWhenInUseUsageDescription: $(APP_NAME) uses your location to tell you when you reach a metro or RER station, also when the app is closed.
        UIBackgroundModes:
          - location
        PRIMAPIKey: $(PRIM_API_KEY)
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  RATPActivityWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    dependencies:
      - package: RATPCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: $(APP_NAME)
        CFBundleLocalizations: [en, fr]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)Widget
        PRODUCT_BUNDLE_IDENTIFIER: $(WIDGET_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  RATPActivityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: RATPActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RATP_BUNDLE_ID_PREFIX).trome.dev.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RATPActivity

  RATPActivityDocsScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - DocsScreenshots
      - UITests/SimulatorNotificationService.swift
    dependencies:
      - target: RATPActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RATP_BUNDLE_ID_PREFIX).trome.dev.docs-screenshots
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RATPActivity

  RATPActivityRenderCheckHost:
    type: application
    platform: iOS
    sources:
      - RenderCheck/Host
      - Widget/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RATP_BUNDLE_ID_PREFIX).trome.dev.render-check-host
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  RATPActivityRenderCheck:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RenderCheck
        excludes:
          - Host
      - path: Widget
        excludes:
          - RATPActivityWidgetBundle.swift
          - Localizable.xcstrings
    dependencies:
      - package: RATPCore
      - target: RATPActivityRenderCheckHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(RATP_BUNDLE_ID_PREFIX).trome.dev.render-check
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RATPActivity:
    build:
      targets:
        RATPActivity: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: RATPCore/RATPCoreTests

  RATPActivityE2E:
    build:
      targets:
        RATPActivity: all
    test:
      config: Debug
      targets:
        - RATPActivityUITests

  RATPActivityDocsScreenshots:
    build:
      targets:
        RATPActivity: all
    test:
      config: Debug
      targets:
        - RATPActivityDocsScreenshots

  RATPActivityRenderCheck:
    build:
      targets:
        RATPActivityRenderCheck: all
    test:
      config: Debug
      targets:
        - RATPActivityRenderCheck
